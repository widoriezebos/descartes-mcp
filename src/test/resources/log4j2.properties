status = error
name = DescartesTest

# ============================
# Console Appender
# ============================
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{dd-MM-yyyy HH:mm:ss} %5p %c{1}:%L - %m%n

# ============================
# File Appender - Error Log
# ============================
appender.errorFile.type = RollingFile
appender.errorFile.name = ERROR_FILE
appender.errorFile.fileName = target/logs/error.log
appender.errorFile.filePattern = target/logs/error-%d{yyyy-MM-dd}.log.gz
appender.errorFile.layout.type = PatternLayout
appender.errorFile.layout.pattern = %d{ISO8601} [%t] %-5level %logger{36} - %msg%n
appender.errorFile.filter.threshold.type = ThresholdFilter
appender.errorFile.filter.threshold.level = ERROR
appender.errorFile.policies.type = Policies
appender.errorFile.policies.time.type = TimeBasedTriggeringPolicy
appender.errorFile.policies.size.type = SizeBasedTriggeringPolicy
appender.errorFile.policies.size.size = 10MB
appender.errorFile.strategy.type = DefaultRolloverStrategy
appender.errorFile.strategy.max = 10

# ============================
# File Appender - All Logs
# ============================
appender.allFile.type = RollingFile
appender.allFile.name = ALL_FILE
appender.allFile.fileName = target/logs/application.log
appender.allFile.filePattern = target/logs/application-%d{yyyy-MM-dd}.log.gz
appender.allFile.layout.type = PatternLayout
appender.allFile.layout.pattern = %d{ISO8601} [%t] %-5level %logger{36} - %msg%n
appender.allFile.policies.type = Policies
appender.allFile.policies.time.type = TimeBasedTriggeringPolicy
appender.allFile.policies.size.type = SizeBasedTriggeringPolicy
appender.allFile.policies.size.size = 10MB
appender.allFile.strategy.type = DefaultRolloverStrategy
appender.allFile.strategy.max = 10

# ============================
# Root Logger
# ============================
rootLogger.level = info
rootLogger.appenderRefs = console, errors, full
rootLogger.appenderRef.console.ref = STDOUT
rootLogger.appenderRef.errors.ref = ERROR_FILE
rootLogger.appenderRef.full.ref = ALL_FILE

# ============================
# Logger for com.bitsapplied.descartes
# ============================
logger.descartesLogger.name = com.bitsapplied.descartes
logger.descartesLogger.level = info
logger.descartesLogger.additivity = true


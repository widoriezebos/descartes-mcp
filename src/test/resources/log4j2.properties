status = error
name = DescartesTest
packages = com.bitsapplied.descartes.util

# ============================
# Console Appender
# ============================
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{dd-MM-yyyy HH:mm:ss} %5p %c{1}:%L - %m%n

# ============================
# Custom In-Memory Appender
# ============================
appender.inMemory.type = InMemoryAppender
appender.inMemory.name = INMEMORY
appender.inMemory.layout.type = PatternLayout
appender.inMemory.layout.pattern = %d{dd-MM-yyyy HH:mm:ss} %5p %c{1}:%L - %m%n
# Maximum number of lines to buffer
appender.inMemory.maxBufferSize = 500
# When full, truncate the buffer to the most recent 400 lines
appender.inMemory.truncateBackTo = 400
appender.inMemory.loggerFilter = com.bitsapplied.*

# ============================
# Root Logger
# ============================
rootLogger.level = info
#rootLogger.appenderRefs = console, errors, inMemory
rootLogger.appenderRefs = console, errors, inMemory, full
rootLogger.appenderRef.console.ref = STDOUT
rootLogger.appenderRef.errors.ref = ERROR_FILE
rootLogger.appenderRef.inMemory.ref = INMEMORY
rootLogger.appenderRef.full.ref = ALL_FILE

# ============================
# Logger for com.bitsapplied.descartes
# ============================
logger.descartesLogger.name = com.bitsapplied.descartes
logger.descartesLogger.level = info
logger.descartesLogger.additivity = true


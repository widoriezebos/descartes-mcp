[mcp_servers.descartes-proxy]
command = "node"
args = ["config/mcp/mcp-tcp-adapter.js"]
cwd = "."
tool_timeout_sec = 130

[mcp_servers.descartes-proxy.env]
MCP_HOST = "localhost"
MCP_PORT = "9090"
MCP_DEBUG = "false"
MCP_RECONNECT_MIN_DELAY = "500"
MCP_RECONNECT_MAX_DELAY = "5000"
MCP_MESSAGE_QUEUE_SIZE = "100"
MCP_REQUEST_TIMEOUT = "130000"
MCP_TOOL_TIMEOUT_MS = "120000"
MCP_DEBUGGER_EVENTS_WAIT_TIMEOUT_GRACE_MS = "5000"
MCP_TCP_KEEP_ALIVE = "10000"
MCP_LOG_RATE_LIMIT_WINDOW = "60000"
MCP_LOG_RATE_LIMIT_MAX = "10"
